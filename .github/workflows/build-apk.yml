name: Build APK Android

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # permet aussi de le lancer manuellement depuis GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Java (nécessaire pour Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer les dépendances npm
        run: npm install

      - name: Ajouter la plateforme Android (générée à chaque build, pas commitée)
        run: npx cap add android

      - name: Synchroniser Capacitor (copie la config vers le projet Android)
        run: npx cap sync android

      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      - name: Construire l'APK (debug, non signé)
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK comme fichier téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: maitre-de-maison-parent-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
