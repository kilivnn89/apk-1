<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Maître de Maison</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, Roboto, Arial, sans-serif;
    background: #1a73e8;
    color: white;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  h1 { font-size: 1.4rem; margin-bottom: .5rem; }
  p { opacity: .9; margin-bottom: 1.5rem; }
  button {
    background: white;
    color: #1a73e8;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
  }
</style>
</head>
<body>
  <h1>Maître de Maison</h1>
  <p>Connexion impossible pour le moment.<br/>Vérifie ta connexion internet.</p>
  <button onclick="location.reload()">Réessayer</button>
</body>
</html>
